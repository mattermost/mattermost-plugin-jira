  profile: chill
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_instructions: "Do not do a summary of the changes. Just include a Change Impact assessment that evaluates the changes and assign an impact level: Low, Medium, or High.\n\nBase your assessment on the following criteria:\n\nRegression Risk:\n- How likely are the changes to break existing behavior?\n- Are there untested code paths affected?\n- Does the change touch shared utilities, base classes, or widely-imported modules?\n- Are there side effects that could propagate to unrelated parts of the system?\n\nHigh-Risk Flow Coverage\n\n- Do the changes touch authentication, authorization, or session management?\n- Do they modify data persistence, migrations, or data integrity logic?\n- Do they impact core business logic or user-facing critical paths?\n- Do they change public APIs, contracts, or inter-service communication?\n\nBlast Radius\n\n- How many systems, modules, or consumers are affected?\n- Are the changes isolated or do they ripple across layers?\n\nImpact Levels\n- Low:\tIsolated changes (single module/component), no shared dependencies affected, high test coverage exists, no critical paths involved, low blast radius. \n- Medium: Changes span multiple modules or touch shared code, some high-risk flows adjacent but not central, partial test coverage, rollback is straightforward\n- High: Touches authentication, payments, data integrity, or core business logic; wide blast radius; low or missing test coverage on affected paths; behavioral contract changes\n\nInclude it before the release notes tag in the current description. \n\nOutput Format\n\n## Change Impact: [Low | Medium | High] Use a dot color emoji. \n\n**Reasoning:** [1–2 sentence summary of why this level was chosen]\n**Regression Risk:** [brief rationale]\n** QA Recommendation:** [how much manual QA is recommended and risk assessment to skip manual QA]\n*Generated by CodeRabbitAI*"
  high_level_summary_placeholder: '@coderabbitai summary'
  high_level_summary_in_walkthrough: false
  auto_title_placeholder: '@coderabbitai'
